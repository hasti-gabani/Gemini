<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini</title>
<style>
  :root{
    --bg:#131314; --side:#1e1f20; --side-hover:#2a2b2d; --input:#1e1f20;
    --text:#e3e3e3; --muted:#a8a8a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif;display:flex;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* ---------- Sidebar ---------- */
  .sidebar{width:288px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
  .sidebar.collapsed{width:72px}
  .sidebar.collapsed .hide-c{display:none}
  .side-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:500}
  .icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:hover{background:var(--side-hover);color:var(--text)}
  .side-scroll{flex:1;overflow-y:auto;padding:0 8px}
  .side-scroll::-webkit-scrollbar{width:6px}
  .side-scroll::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
  .nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:7px 12px;border-radius:20px;font-size:14px;text-align:left}
  .nav-item:hover{background:var(--side-hover)}
  .nav-item.active{background:#282a2c}
  .sec-title{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;padding:22px 8px 8px}
  .chat-item{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:16px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-item:hover{background:var(--side-hover)}
  .profile{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #2a2b2d}
  .avatar{width:32px;height:32px;border-radius:50%;background:conic-gradient(#f28b82,#fbbc04,#81c995,#8ab4f8,#c58af9,#f28b82);display:grid;place-items:center;font-weight:600;font-size:14px;color:#202124}
  .profile .name{font-size:14px;line-height:1.2}
  .profile .plan{font-size:12px;color:var(--muted)}
  .profile .icon-btn{margin-left:auto}

  /* ---------- Main ---------- */
  .main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;
    background:radial-gradient(ellipse 45% 55% at 50% 50%, rgba(30,50,140,.55), rgba(19,19,20,0) 70%), var(--bg)}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:14px 20px}
  .get-app{display:flex;align-items:center;gap:8px;background:#1e1f20;padding:8px 14px;border-radius:20px;font-size:14px}
  .get-app:hover{background:#2a2b2d}
  .menu-mobile{display:none;margin-right:auto}

  .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 60px}
  .home h1{font-size:36px;font-weight:400;margin-bottom:28px;text-align:center}

  .chat-view{flex:1;overflow-y:auto;padding:20px 16px 0;display:none}
  .chat-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
  .msg-user{align-self:flex-end;background:#2a2b2d;padding:10px 16px;border-radius:18px 4px 18px 18px;max-width:75%;white-space:pre-wrap;word-break:break-word}
  .msg-bot{display:flex;gap:12px;align-items:flex-start}
  .msg-err{border:1px solid rgba(229,115,115,.45);background:rgba(229,115,115,.08);color:#f2b8b5;padding:12px 16px;border-radius:12px;display:flex;gap:10px;align-items:center}
  .typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .composer-wrap{width:100%;max-width:660px}
  .bottom-composer{display:none;padding:10px 16px 20px;justify-content:center}
  .composer{display:flex;align-items:center;gap:10px;background:var(--input);border-radius:32px;padding:10px 12px 10px 18px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .composer input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
  .composer input::placeholder{color:var(--muted)}
  .model{display:flex;align-items:center;gap:6px;font-size:14px;padding:6px 10px;border-radius:18px;white-space:nowrap}
  .model:hover,.composer .icon-btn:hover{background:#2a2b2d}
  .model svg{width:16px;height:16px}
  .modes{display:flex;justify-content:center;gap:6px;margin-top:14px}
  .mode{padding:8px 14px;border-radius:20px;font-size:14px}
  .mode.active{background:#2a2b2d;border:1px solid #3c4043}
  .suggest{margin-top:40px;display:flex;flex-direction:column;gap:22px;align-self:center}
  .suggest button{display:flex;align-items:center;gap:10px;font-size:15px;text-align:left}
  .suggest button:hover{color:#fff}
  .suggest svg{width:18px;height:18px}

  /* ---------- Responsive ---------- */
  @media (max-width:800px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s}
    .sidebar.open{transform:none}
    .menu-mobile{display:grid}
    .model span{display:none}
    .home h1{font-size:28px}
  }
</style>
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <div class="side-top">
    <div class="brand hide-c">
      <svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset=".5" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs>
        <path fill="url(#g)" d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/>
      </svg>
      Gemini
    </div>
    <div style="display:flex;gap:2px">
      <button class="icon-btn hide-c" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="collapseBtn" title="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
  </div>

  <div class="side-scroll">
    <button class="nav-item active" id="newChatBtn"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="hide-c">New chat</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span class="hide-c">Library</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span class="hide-c">Images</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="hide-c">Scheduled</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg><span class="hide-c">Students</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span class="hide-c">More</span></button>

    <div class="hide-c">
      <div class="sec-title">Notebooks</div>
      <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New notebook</button>
      <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18"/></svg>Untitled notebook</button>

      <div class="sec-title">All <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M3 4h18l-7 9v6l-4 2v-8z"/></svg></div>
      <div id="history"></div>
    </div>
  </div>

  <div class="profile">
    <div class="avatar">H</div>
    <div class="hide-c"><div class="name">hasti gabani</div><div class="plan">Pro</div></div>
    <button class="icon-btn hide-c" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</aside>

<!-- ================= MAIN ================= -->
<main class="main">
  <div class="topbar">
    <button class="icon-btn menu-mobile" id="menuMobile"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="get-app"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Get app</button>
    <button class="icon-btn" id="newChatTop" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </div>

  <!-- Home screen -->
  <section class="home" id="home">
    <h1>Where should we start?</h1>
    <div class="composer-wrap" id="composerHome"></div>
    <div class="modes">
      <button class="mode active">Chat</button>
      <button class="mode">Task</button>
    </div>
    <div class="suggest">
      <button data-q="Plan a road trip based on my interests"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-4 0 2-6z"/></svg>Plan a road trip based on my interests</button>
      <button data-q="Write a professional email format"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Write a professional email format</button>
      <button data-q="Brainstorm 5 unique party themes"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m9 12 2 2 4-4"/></svg>Brainstorm 5 unique party themes</button>
    </div>
  </section>

  <!-- Chat screen -->
  <section class="chat-view" id="chatView"><div class="chat-inner" id="chatInner"></div></section>
  <div class="bottom-composer" id="bottomComposer"><div class="composer-wrap" id="composerBottom"></div></div>

  <!-- Composer (moved between home and bottom) -->
  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="icon-btn" title="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <input id="prompt" placeholder="Ask Gemini">
    <button type="button" class="model"><span>Flash-Lite</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <button type="submit" class="icon-btn" title="Send"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </form>
</main>

<script>
(() => {
  // The code 0000 opens the Gemini billing app (the Vyapar-style app in this folder).
  // ?gemini=open tells that app to skip its own Gemini start screen, since it was already passed here.
  const APP_URL = "http://localhost:3100/?gemini=open";

  const $ = id => document.getElementById(id);

  /* ---------- Sidebar ---------- */
  const history = ["Clarifying Contact for Call","Saffron Paagh Image Enhancement","Saffron Swami 3D Portrait Enhancement",
    "3D Foot Anatomy Image Enhancement","Face Replacement in Digital Painting","High-Detail Gold Jewellery Regeneration",
    "3D Hand Anatomy Correction","Hand Correction in 3D Render","3D Foot and Garment Rendering","Correcting Hands in 3D Render",
    "Hand Anatomy Correction in 3D Render","Semi-Realistic 3D Image Regeneration"];
  $("history").innerHTML = history.map(h => `<button class="chat-item">${h}</button>`).join("");

  $("collapseBtn").onclick = () => {
    if (window.innerWidth <= 800) $("sidebar").classList.remove("open");
    else $("sidebar").classList.toggle("collapsed");
  };
  $("menuMobile").onclick = () => $("sidebar").classList.add("open");

  /* ---------- Chat ---------- */
  const composer = $("composer"), prompt = $("prompt");
  $("composerHome").appendChild(composer);

  function goHome(){
    $("chatInner").innerHTML = "";
    $("chatView").style.display = "none";
    $("bottomComposer").style.display = "none";
    $("home").style.display = "flex";
    $("composerHome").appendChild(composer);
    prompt.value = ""; prompt.focus();
  }
  function goChat(){
    $("home").style.display = "none";
    $("chatView").style.display = "block";
    $("bottomComposer").style.display = "flex";
    $("composerBottom").appendChild(composer);
  }
  $("newChatBtn").onclick = goHome;
  $("newChatTop").onclick = goHome;

  const escapeHtml = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const isOpenCmd = t => t.replace(/\s+/g, "") === "0000";

  // Resolves true when the app's server answers (an image from it loads).
  function appRunning(){
    return new Promise(resolve => {
      const img = new Image();
      const timer = setTimeout(() => resolve(false), 2500);
      img.onload = () => { clearTimeout(timer); resolve(true); };
      img.onerror = () => { clearTimeout(timer); resolve(false); };
      img.src = "http://localhost:3100/favicon.svg?t=" + Date.now();
    });
  }

  function reply(bot, html){
    bot.innerHTML = `<div class="msg-err">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <div>${html}</div></div>`;
    $("chatView").scrollTop = $("chatView").scrollHeight;
  }

  async function send(text){
    text = text.trim();
    if (!text) return;
    prompt.value = "";

    goChat();
    const inner = $("chatInner");
    inner.insertAdjacentHTML("beforeend", `<div class="msg-user">${escapeHtml(text)}</div>`);
    const bot = document.createElement("div");
    bot.className = "msg-bot";
    bot.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    inner.appendChild(bot);
    $("chatView").scrollTop = $("chatView").scrollHeight;

    if (isOpenCmd(text)) {
      if (await appRunning()) { window.location.href = APP_URL; return; }
      reply(bot, `<b>Server not working.</b> The app is not running. Start it with <b>Start Gemini.bat</b>, then
        <a href="${APP_URL}" style="color:#8ab4f8">open it</a>.`);
      return;
    }
    setTimeout(() => reply(bot, `<b>Server not working.</b> Something went wrong. Please try again later.`), 1200);
  }

  composer.addEventListener("submit", e => { e.preventDefault(); send(prompt.value); });
  document.querySelectorAll(".suggest button").forEach(b => b.onclick = () => send(b.dataset.q));
  document.querySelectorAll(".mode").forEach(m => m.onclick = () => {
    document.querySelectorAll(".mode").forEach(x => x.classList.remove("active")); m.classList.add("active");
  });

  prompt.focus();
})();
</script>
</body>
</html>
